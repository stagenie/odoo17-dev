[options]
; ═══════════════════════════════════════════════════════════════
; CONFIGURATION ODOO 17 — OdooSkills (personnel — modules oski_*)
; Bases visibles : o17_odooskills_*, odooskills_dev17, odooskills_test17
; ═══════════════════════════════════════════════════════════════

admin_passwd = St@odoodev
db_host = False
db_port = False
db_user = stadev
db_password = St@dev

; Addons : core Odoo 17 + modules OdooSkills (branche 17.0)
; PAS de modules ADICOPS clients (séparation perso/pro stricte)
addons_path =
	/home/stadev/odoo17-dev/addons,
	/home/stadev/odoo17-dev/content/apps/free,
	/home/stadev/odoo17-dev/content/apps/pro,
	/home/stadev/odoo17-dev/adi_third_party/adi_third_party2

xmlrpc_port = 8117
dbfilter = ^(o17_odooskills_|odooskills_dev17|odooskills_test17)

; Notes :
; - Switch avec odoo17.conf (même port 8117, addons ADICOPS) via IDE PyCharm
; - Pour porter un module v19 → v17, voir skill .claude/skills/odoo-version-porting
;   ATTENTION saut clé v18 → v17 : conversion attrs="..." → invisible/readonly/required
; - Test typique : ./odoo-bin -c odoo17_odooskills.conf -d o17_odooskills_test_oski_X --init=oski_X --stop-after-init
